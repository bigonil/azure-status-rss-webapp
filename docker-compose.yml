services:
  azure-rss-webapp:
    build: .
    container_name: azure-rss-webapp
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      CACHE_TTL_MS: "60000"
      REQUEST_TIMEOUT_MS: "10000"
      # URL ufficiale Azure Status RSS (status.azure.com reindirizza qui)
      AZURE_RSS_FEEDS: "https://azure.status.microsoft/en-us/status/feed/"
    restart: unless-stopped
